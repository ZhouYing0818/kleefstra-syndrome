<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 - Kleefstra 综合征</title>
  <meta name="robots" content="noindex, follow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Noto Sans SC", "Inter", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f0e8;
      color: #2d3436;
    }
    .box { text-align: center; max-width: 520px; }
    .code {
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 2px;
      color: #1a6b5a;
    }
    h1 { font-size: 22px; margin: 18px 0 10px; }
    p { color: #636e72; font-size: 15px; line-height: 1.7; }
    .en { color: #b2bec3; font-size: 13px; margin-top: 8px; }
    a {
      display: inline-block;
      margin-top: 26px;
      padding: 12px 30px;
      border-radius: 999px;
      background: #1a6b5a;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a:hover { background: #2a9d8f; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>页面未找到</h1>
    <p>抱歉，您访问的页面不存在或已被移动。</p>
    <p class="en">Sorry, the page you requested could not be found.</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
